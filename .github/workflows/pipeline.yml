name: Kids Content Pipeline
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m compileall pipeline worker.py
      - run: pytest -q
      - run: python -m pipeline.generate_scene

  dry-run:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -c "from pipeline.topic_pipeline import create_topic_package; from pathlib import Path; print(create_topic_package('colors', Path('/tmp/kids-demo')))"
      - run: python -c "from pipeline.orchestrator import Orchestrator; print(Orchestrator().run('content/demo_episode.json', dry_run=True))"

  render-smoke:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build render worker image
        run: docker build -f Dockerfile.render -t kids-content-engine-render .
      - name: Render ABC test episode
        run: |
          mkdir -p /tmp/kids-render
          docker run --rm             -e RENDER_ENABLED=1             -v "$PWD:/app"             -v "/tmp/kids-render:/tmp/kids-content-engine"             kids-content-engine-render             python -c "from pipeline.orchestrator import Orchestrator; import json; r=Orchestrator('/tmp/kids-content-engine').run('/app/content/demo_episode.json', dry_run=False); print(json.dumps(r, indent=2)); assert r['qc'].get('ok') is True"
      - name: Inspect rendered MP4
        run: |
          test -s /tmp/kids-render/ABC_Alphabet_Adventure/render.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_type,codec_name,width,height -of json /tmp/kids-render/ABC_Alphabet_Adventure/render.mp4
      - name: Upload render artifact
        uses: actions/upload-artifact@v4
        with:
          name: abc-alphabet-adventure-render
          path: /tmp/kids-render/ABC_Alphabet_Adventure/
          if-no-files-found: error
