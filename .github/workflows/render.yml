name: Real Blender Render

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build render worker
        run: docker build -f Dockerfile.render -t kids-content-engine-render .

      - name: Run real render
        run: |
          mkdir -p /tmp/kids-render
          docker run --rm \
            -e RENDER_ENABLED=1 \
            -e TTS_ENABLED=1 \
            -v "$PWD:/app" \
            -v "/tmp/kids-render:/tmp/kids-content-engine" \
            kids-content-engine-render \
            python -c "from pipeline.orchestrator import Orchestrator; import json; r=Orchestrator('/tmp/kids-content-engine').run('/app/content/demo_episode.json', dry_run=False); print(json.dumps(r, indent=2)); assert r['qc'].get('ok') is True"

      - name: Verify final MP4
        run: |
          test -s /tmp/kids-render/ABC_Alphabet_Adventure/render.mp4 || test -s /tmp/kids-render/ABC_Alphabet_Adventure/final.mp4
          find /tmp/kids-render -type f -maxdepth 4 -print

      - name: Upload production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kids-content-render
          path: /tmp/kids-render/
          if-no-files-found: error
